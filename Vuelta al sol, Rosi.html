<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: lienzo a pantalla completa; el planeta (agujero negro con anillo dorado) al centro, frases y girasoles orbitando en 3D que se pueden girar, mover y acercar. */
  :root {
    --bg: #000000;
    --gold: #ffd23a;
    --amber: #ffb000;
    --cream: #fff1b8;
    --glass: rgba(255, 200, 60, .12);
    --glass-line: rgba(255, 210, 90, .38);
    --font-title: 'Gaegu', 'Comic Sans MS', 'Segoe Print', cursive;
    --font-script: 'Dancing Script', 'Brush Script MT', cursive;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #c { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c.drag { cursor: grabbing; }
  #title {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    margin: 0; padding-inline: 16px;
    text-align: center;
    font-family: var(--font-title); font-weight: 700;
    font-size: clamp(22px, 6.4vw, 34px); line-height: 1.15;
    color: #ffe066; text-wrap: balance;
    text-shadow: 0 0 6px rgba(255, 190, 0, .9), 0 0 18px rgba(255, 160, 0, .7);
    pointer-events: none;
    animation: glow 3.2s ease-in-out infinite;
    opacity: 0; transition: opacity 2s ease 1.2s;
  }
  #title.on { opacity: 1; }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 6px rgba(255, 190, 0, .8), 0 0 14px rgba(255, 160, 0, .5); }
    50% { text-shadow: 0 0 8px rgba(255, 210, 60, 1), 0 0 26px rgba(255, 170, 0, .9); }
  }
  #start {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: var(--bg); cursor: pointer;
    transition: opacity 1.4s ease; z-index: 5;
  }
  #start.off { opacity: 0; pointer-events: none; }
  .sun {
    font-size: 68px; line-height: 1;
    filter: drop-shadow(0 0 14px rgba(255, 176, 0, .95)) drop-shadow(0 0 34px rgba(255, 176, 0, .55));
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  #start p {
    margin: 0; font-family: var(--font-script); font-size: 21px; color: var(--gold);
    text-shadow: 0 0 10px rgba(255, 176, 0, .7);
    animation: blink 2.6s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
  #ctrl {
    position: fixed; right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
    display: flex; flex-direction: column; gap: 10px;
    opacity: 0; transition: opacity 1.5s ease 2s; z-index: 3;
  }
  #ctrl.on { opacity: 1; }
  #ctrl button {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--glass-line); background: var(--glass);
    color: #ffe27a; font-size: 22px; line-height: 1; font-family: var(--font-title); font-weight: 700;
    display: grid; place-items: center; padding: 0; cursor: pointer;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    box-shadow: 0 0 12px rgba(255, 176, 0, .25);
  }
  #ctrl button:active { background: rgba(255, 200, 60, .28); }
  #ctrl button:focus-visible { outline: 2px solid #ffe27a; outline-offset: 2px; }
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    margin: 0; padding-inline: 16px; text-align: center;
    font-family: var(--font-title); font-size: 17px; color: #ffe9a0;
    text-shadow: 0 0 8px rgba(255, 176, 0, .8);
    pointer-events: none; opacity: 0; transition: opacity 1.4s ease; z-index: 3;
  }
  #hint.on { opacity: .9; }
  @media (prefers-reduced-motion: reduce) {
    .sun, #start p, #title { animation: none; }
  }
</style>

        c: Math.random() < 0.18 ? 1 : (Math.random() < 0.1 ? 2 : 0), ph: rnd(0, TAU) });
    }
  }

  /* ---------- planeta ---------- */
  function diskPass(cx, cy, rx, tilt, t, R, clipUpper) {
    ctx.save();
    ctx.beginPath();
    if (clipUpper) ctx.rect(0, 0, W, cy); else ctx.rect(0, cy, W, H);
    ctx.clip();
    ctx.translate(cx, cy);
    ctx.scale(1, tilt);
    var k0 = R / rx;
    var gr = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    gr.addColorStop(0, 'rgba(255,250,220,0)');
    gr.addColorStop(Math.max(0.01, k0 - 0.02), 'rgba(255,250,220,0)');
    gr.addColorStop(k0, 'rgba(255,252,225,1)');
    gr.addColorStop(k0 + 0.07, 'rgba(255,236,125,1)');
    gr.addColorStop(k0 + 0.24, 'rgba(255,200,30,0.96)');
    gr.addColorStop(k0 + 0.46, 'rgba(255,160,0,0.55)');
    gr.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill();
    ctx.lineWidth = Math.max(0.8, rx * 0.010);
    var i;
    for (i = 0; i < 26; i++) {
      var k = k0 + 0.01 + i * 0.026;
      if (k >= 1) break;
      var a = 0.65 + 0.35 * Math.sin(t * 1.5 + i * 1.3);
      ctx.strokeStyle = (i % 2) ? 'rgba(255,255,255,' + (0.20 * a) + ')' : 'rgba(180,90,0,' + (0.20 * a) + ')';
      ctx.beginPath(); ctx.arc(0, 0, rx * k, 0, TAU); ctx.stroke();
    }
    if (ctx.createConicGradient) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, rx, 0, TAU);
      ctx.arc(0, 0, R, 0, TAU, true);
      ctx.clip('evenodd');
      var cg = ctx.createConicGradient(0, 0, 0);
      cg.addColorStop(0, 'rgba(40,10,0,0.42)');
      cg.addColorStop(0.5, 'rgba(255,255,235,0.26)');
      cg.addColorStop(1, 'rgba(40,10,0,0.42)');
      ctx.fillStyle = cg;
      ctx.fillRect(-rx, -rx, rx * 2, rx * 2);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawHole(cx, cy, R, e, t) {
    var rx = R * 3.2;
    var tilt = Math.max(0.06, Math.sin(e));
    var halo = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, rx * 2.2);
    halo.addColorStop(0, 'rgba(255,205,50,0.42)');
    halo.addColorStop(0.4, 'rgba(255,165,0,0.16)');
    halo.addColorStop(1, 'rgba(255,140,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, rx * 2.2, 0, TAU); ctx.fill();

    diskPass(cx, cy, rx, tilt, t, R, true);

    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();

    /* arco de lente gravitacional sobre la esfera */
    ctx.save();
    ctx.lineCap = 'round';
    var lg = ctx.createLinearGradient(cx - R * 1.3, 0, cx + R * 1.3, 0);
    lg.addColorStop(0, 'rgba(255,190,50,0)');
    lg.addColorStop(0.5, 'rgba(255,248,215,0.95)');
    lg.addColorStop(1, 'rgba(255,190,50,0)');
    ctx.strokeStyle = lg;
    ctx.globalAlpha = 0.28; ctx.lineWidth = R * 0.30;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.14, Math.PI * 1.06, Math.PI * 1.94); ctx.stroke();
    ctx.globalAlpha = 0.95; ctx.lineWidth = Math.max(1, R * 0.07);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.06, Math.PI * 1.04, Math.PI * 1.96); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,205,70,0.55)';
    ctx.lineWidth = Math.max(1, R * 0.03);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.012, 0, TAU); ctx.stroke();

    diskPass(cx, cy, rx, tilt, t, R, false);
  }

  /* ---------- dibujo ---------- */
  var pool = [], vis = [];
  var STAR_COL = ['255,244,214', '190,215,255', '255,200,140'];

  function frame(now) {
    requestAnimationFrame(frame);
    if (!started) { lastNow = now; return; }
    var dt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000));
    lastNow = now;
    var el = (now - tStart) / 1000;
    var t = el * (reduce ? 0.3 : 1);
    var intro = clamp(el / 2.6, 0, 1);

    /* suavizado de camara */
    var introPhase = el < 5.5 && !touched;
    var rateD = introPhase ? 1.15 : 9;
    D += (Dt - D) * (1 - Math.exp(-dt * rateD));
    var rp = 1 - Math.exp(-dt * 10);
    panX += (panTx - panX) * rp; panY += (panTy - panY) * rp;
    elev += (elevT - elev) * rp;
    var dragging = ptrs.size > 0;
    if (!dragging) {
      yaw += vyaw * dt;
      vyaw *= Math.exp(-dt * 2.2);
      if (now / 1000 - lastTouch > 2.5 && !reduce) {
        var auto = 0.05;
        vyaw += (auto - vyaw) * (1 - Math.exp(-dt * 0.8));
      }
    }
    var spin = introPhase ? Math.pow(1 - clamp(el / 5.5, 0, 1), 2) * 1.5 : 0;
    var yw = yaw + spin;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    var cx0 = W / 2, cy0 = H * 0.53;
    var cx = cx0 + panX, cy = cy0 + panY;
    var cyw = Math.cos(yw), syw = Math.sin(yw), ce = Math.cos(elev), se = Math.sin(elev);

    /* estrellas lejanas */
    var K = U * 1.15 * (1 + (D_HOME / D - 1) * 0.08);
    var i, s0;
    for (i = 0; i < stars.length; i++) {
      s0 = stars[i];
      var x1 = s0.x * cyw - s0.z * syw;
      var z1 = s0.x * syw + s0.z * cyw;
      var z2 = s0.y * se + z1 * ce;
      if (z2 < 0.05) continue;
      var y2 = s0.y * ce - z1 * se;
      var pr = K / (z2 + 0.35);
      var sx = cx0 + panX * 0.25 + x1 * pr, sy = cy0 + panY * 0.25 + y2 * pr;
      if (sx < -3 || sx > W + 3 || sy < -3 || sy > H + 3) continue;
      var tw = 0.55 + 0.45 * Math.sin(t * (1.1 + s0.m * 0.4) + s0.ph);
      ctx.globalAlpha = intro * tw * clamp(0.35 + s0.m * 0.3, 0, 1);
      ctx.fillStyle = 'rgb(' + STAR_COL[s0.c] + ')';
      if (s0.m > 2.3) {
        ctx.beginPath(); ctx.arc(sx, sy, s0.m * 0.55, 0, TAU); ctx.fill();
        ctx.globalAlpha *= 0.5;
        ctx.fillRect(sx - s0.m * 2.4, sy - 0.4, s0.m * 4.8, 0.8);
        ctx.fillRect(sx - 0.4, sy - s0.m * 2.4, 0.8, s0.m * 4.8);
      } else {
        ctx.fillRect(sx, sy, s0.m, s0.m);
      }
    }

    /* objetos 3D */
    var n = 0, it;
    vis.length = 0;
    for (i = 0; i < items.length; i++) {
      it = items[i];
      var wx, wy, wz;
      if (it.type === 'p') {
        var ang = it.a0 + t * it.w;
        wx = it.r * Math.cos(ang); wz = it.r * Math.sin(ang); wy = it.y;
      } else {
        wx = it.x; wz = it.z; wy = it.y + Math.sin(t * 0.6 + it.ph) * 0.07;
      }
      var xa = wx * cyw - wz * syw;
      var za = wx * syw + wz * cyw;
      var yb = wy * ce - za * se;
      var zb = wy * se + za * ce;
      var dd = zb + D;
      if (dd < 0.5) continue;
      var f = U / dd;
      var px = cx + xa * f, py = cy + yb * f;
      var a = clamp(1.15 - zb * 0.22, 0.15, 1) * clamp((dd - 0.5) / 0.9, 0, 1) * intro;
      var s;
      if (it.type === 's' || it.type === 'p') {
        s = it.type === 'p' ? Math.min(0.8 + f * 0.004, 2.6) * (0.6 + it.k * 0.25) : it.k;
        if (px < -4 || px > W + 4 || py < -4 || py > H + 4) continue;
        var tt = Math.sin(t * 1.4 + it.ph);
        a *= it.type === 'p' ? (0.55 + 0.45 * tt * tt) : (0.4 + 0.6 * tt * tt);
      } else {
        s = f * it.k;
        var hw = it.spr.w * s * 0.5, hh = it.spr.h * s * 0.5;
        if (px + hw < 0 || px - hw > W || py + hh < 0 || py - hh > H) continue;
        if (it.type === 't') a *= 0.85;
        if (it.type === 'n') a *= 0.55;
      }
      var v = pool[n] || (pool[n] = {});
      n++;
      v.it = it; v.sx = px; v.sy = py; v.s = s; v.a = a; v.z = zb;
      vis.push(v);
    }
    vis.sort(function (p, q) { return q.z - p.z; });

    var R = (U / D) * HOLE_W;
    var holeDrawn = false, k, v2;
    for (k = 0; k < vis.length; k++) {
      v2 = vis[k];
      if (!holeDrawn && v2.z <= 0) {
        ctx.globalAlpha = intro;
        drawHole(cx, cy, R, elev, t);
        holeDrawn = true;
      }
      ctx.globalAlpha = v2.a;
      var ty = v2.it.type;
      if (ty === 's') {
        ctx.fillStyle = v2.it.c ? '#ffd27a' : '#fff0c0';
        ctx.fillRect(v2.sx, v2.sy, v2.s, v2.s);
      } else if (ty === 'p') {
        ctx.fillStyle = (k & 1) ? '#fff2b8' : '#ffc233';
        ctx.fillRect(v2.sx, v2.sy, v2.s, v2.s);
      } else {
        var sp = v2.it.spr;
        ctx.drawImage(sp.c, v2.sx - sp.w * v2.s / 2, v2.sy - sp.h * v2.s / 2, sp.w * v2.s, sp.h * v2.s);
      }
    }
    if (!holeDrawn) {
      ctx.globalAlpha = intro;
      drawHole(cx, cy, R, elev, t);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- audio ---------- */
  var audio = null, fadeIv = null;
  function startAudio() {
    try {
      audio = new Audio(SONG);
      audio.loop = true;
      audio.preload = 'auto';
      audio.volume = 0;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
      var vv = 0;
      fadeIv = setInterval(function () {
        vv = Math.min(0.9, vv + 0.03);
        try { audio.volume = vv; } catch (e) {}
        if (vv >= 0.9) { clearInterval(fadeIv); }
      }, 100);
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (!audio) return;
    if (document.hidden) { audio.pause(); }
    else { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
  });

  /* ---------- entrada ---------- */
  function launch() {
    resize();
    tStart = performance.now();
    lastNow = tStart;
    started = true;
    titleEl.classList.add('on');
    ctrlEl.classList.add('on');
    setTimeout(function () { hintEl.classList.add('on'); }, 2800);
    setTimeout(function () { hintEl.classList.remove('on'); }, 11000);
  }
  function begin() {
    if (startEl.classList.contains('off')) return;
    startEl.classList.add('off');
    startAudio();
    var tries = 0;
    (function wait() {
      if (ready) { launch(); return; }
      if (++tries > 60) { prepare(); ready = true; launch(); return; }
      setTimeout(wait, 50);
    })();
  }
  function prepare() {
    resize();
    buildWorld();
    ready = true;
  }
  startEl.addEventListener('click', begin);
  startEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') begin(); });

  /* ---------- controles ---------- */
  var ptrs = new Map();
  var pinchD = 0, pinchX = 0, pinchY = 0, lastMoveT = 0;

  function note() {
    touched = true;
    lastTouch = performance.now() / 1000;
    hintEl.classList.remove('on');
  }
  function zoomBy(fac) { Dt = clamp(Dt * fac, D_MIN, D_MAX); }
  function pair() {
    var a = Array.from(ptrs.values());
    return { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
  }
  cv.addEventListener('pointerdown', function (e) {
    if (!started) return;
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.button === 1 || e.shiftKey });
    cv.classList.add('drag');
    vyaw = 0;
    if (ptrs.size === 2) { var pr = pair(); pinchD = pr.d; pinchX = pr.x; pinchY = pr.y; }
    lastMoveT = performance.now();
    note();
  });
  cv.addEventListener('pointermove', function (e) {
    var p = ptrs.get(e.pointerId);
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    var nowT = performance.now();
    var dts = Math.max(0.008, (nowT - lastMoveT) / 1000);
    lastMoveT = nowT;
    if (ptrs.size === 1) {
      if (p.pan) {
        panTx = clamp(panTx + dx, -W * 1.4, W * 1.4);
        panTy = clamp(panTy + dy, -H * 1.2, H * 1.2);
      } else {
        yaw += dx * 0.006;
        vyaw = vyaw * 0.6 + (dx * 0.006 / dts) * 0.4;
        elevT = clamp(elevT + dy * 0.004, E_MIN, E_MAX);
      }
    } else if (ptrs.size >= 2) {
      var pr = pair();
      zoomBy(pinchD / pr.d);
      panTx = clamp(panTx + (pr.x - pinchX), -W * 1.4, W * 1.4);
      panTy = clamp(panTy + (pr.y - pinchY), -H * 1.2, H * 1.2);
      pinchD = pr.d; pinchX = pr.x; pinchY = pr.y;
      vyaw = 0;
    }
    note();
  });
  function up(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) cv.classList.remove('drag');
    if (ptrs.size === 1) { var rem = Array.from(ptrs.values())[0]; rem.pan = false; }
    if (ptrs.size === 0 && performance.now() - lastMoveT > 120) vyaw = 0;
    note();
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  cv.addEventListener('wheel', function (e) {
    if (!started) return;
    e.preventDefault();
    zoomBy(Math.exp(e.deltaY * 0.0015));
    note();
  }, { passive: false });
  document.getElementById('zin').addEventListener('click', function () { zoomBy(0.72); note(); });
  document.getElementById('zout').addEventListener('click', function () { zoomBy(1.38); note(); });
  document.getElementById('rst').addEventListener('click', function () {
    Dt = D_HOME; panTx = 0; panTy = 0; elevT = E_HOME; vyaw = 0.05; note();
  });
  window.addEventListener('keydown', function (e) {
    if (!started) return;
    if (e.key === 'ArrowLeft') { yaw -= 0.12; note(); }
    else if (e.key === 'ArrowRight') { yaw += 0.12; note(); }
    else if (e.key === 'ArrowUp') { elevT = clamp(elevT - 0.08, E_MIN, E_MAX); note(); }
    else if (e.key === 'ArrowDown') { elevT = clamp(elevT + 0.08, E_MIN, E_MAX); note(); }
    else if (e.key === '+' || e.key === '=') { zoomBy(0.8); note(); }
    else if (e.key === '-') { zoomBy(1.25); note(); }
  });

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); if (ready) buildWorld(); }, 150);
  });

  /* preparar todo mientras ella ve la pantalla de inicio */
  resize();
  var fontsP = (document.fonts && document.fonts.load)
    ? Promise.race([
        Promise.all([document.fonts.load('700 30px Gaegu'), document.fonts.ready]),
        new Promise(function (r) { setTimeout(r, 2200); })
      ])
    : Promise.resolve();
  fontsP.then(function () { try { prepare(); } catch (e) { ready = true; } });
  requestAnimationFrame(frame);
})();
</script>

</body></html>
